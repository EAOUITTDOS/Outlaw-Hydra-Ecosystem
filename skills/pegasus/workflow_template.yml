pegasus: "5.0"
workflows:
  - name: hydra-security-audit
    jobs:
      - name: network-discovery
        executable: nmap-wrapper
        arguments: ["-sP", "192.168.1.0/24"]
      - name: vuln-scan
        executable: openvas-wrapper
        arguments: ["--target", "discovery-results.xml"]
        uses: network-discovery
